[package]
name = "meshgraph_gateway"
version = "0.1.0"
edition = "2021"
default-run = "meshgraph_gateway"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["ws"] }
libloading = "0.8"
oxigraph = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
