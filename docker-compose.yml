services:
  oxigraph_db:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve --location /data --bind 0.0.0.0:7878
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ./local_graph_store:/data
    restart: unless-stopped

  graph_seed:
    image: curlimages/curl:8.12.1
    depends_on:
      - oxigraph_db
    volumes:
      - ./data:/seed:ro
      - ./scripts/seed-graphs.sh:/seed-graphs.sh:ro
    environment:
      FORCE_SEED: ${FORCE_SEED:-false}
    entrypoint: ["/bin/sh", "/seed-graphs.sh"]
    restart: "no"

  axum_gateway:
    build:
      context: .
    depends_on:
      graph_seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: http://oxigraph_db:7878/query
      DATABASE_UPDATE_URL: http://oxigraph_db:7878/update
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

