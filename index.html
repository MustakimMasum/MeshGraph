<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8edf2">
    <meta
      name="description"
      content="MeshGraph is an interactive WebXR research citation constellation."
    >
    <title>MeshGraph · Research Citation Constellation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #17324d;
        --muted: #617386;
        --cyan: #087f95;
        --violet: #6650a4;
        --panel: rgba(255, 255, 255, 0.86);
        --line: rgba(23, 50, 77, 0.15);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #app-shell {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #e8edf2;
      }

      body { color: var(--ink); }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }

      .topbar {
        position: fixed;
        z-index: 20;
        inset: 0 0 auto 0;
        min-height: 74px;
        display: grid;
        grid-template-columns: minmax(250px, 1fr) minmax(480px, 680px) minmax(250px, 1fr);
        align-items: center;
        gap: 18px;
        padding: 12px 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.76));
        border-bottom: 1px solid var(--line);
        box-shadow: 0 0.5rem 2rem rgba(23, 50, 77, 0.08);
        backdrop-filter: blur(18px);
      }

      .brand-lockup { display: flex; align-items: center; gap: 11px; }
      .brand-lockup h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
      .brand-lockup p { margin: 2px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; }

      .ingest-form {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 132px auto;
        justify-self: center;
        width: 100%;
      }
      .ingest-form input, .ingest-form select {
        min-width: 0;
        color: var(--ink);
        border: 1px solid var(--line);
        outline: 0;
        background: rgba(255, 255, 255, 0.94);
        padding: 11px 12px;
      }
      .ingest-form input { border-radius: 12px 0 0 12px; }
      .ingest-form select {
        border-left: 0;
        border-radius: 0 12px 12px 0;
      }
      .ingest-form input:focus { box-shadow: inset 0 0 0 1px var(--cyan); }
      .ingest-form button, .secondary-button, .mode-switcher button {
        border: 0;
        color: #ffffff;
        background: #17324d;
        padding: 10px 14px;
        font-weight: 750;
        cursor: pointer;
      }
      .ingest-form button {
        margin-left: 10px;
        border-radius: 12px;
        white-space: nowrap;
      }
      .ingest-form button:disabled { opacity: 0.55; cursor: wait; }
      .input-controls {
        justify-self: end;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 7px;
        align-items: center;
      }
      .input-controls label {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .input-controls select {
        min-width: 174px;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
        background: rgba(255, 255, 255, 0.9);
        padding: 9px 10px;
      }
      .secondary-button {
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.9);
      }

      .hud-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 0.5rem 2rem rgba(23, 50, 77, 0.12);
        backdrop-filter: blur(18px);
      }
      .graph-overview {
        position: fixed;
        z-index: 15;
        top: 94px;
        left: 18px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 210px;
        padding: 15px;
        border-radius: 14px;
      }
      .graph-overview strong { font-size: 24px; color: var(--cyan); }
      .graph-overview > span:not(.eyebrow) { color: var(--muted); font-size: 12px; }
      .graph-overview .gesture-state { margin-top: 4px; padding-top: 9px; border-top: 1px solid var(--line); }
      .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; }

      .mode-switcher {
        position: fixed;
        z-index: 15;
        left: 50%;
        bottom: 26px;
        display: flex;
        transform: translateX(-50%);
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
      }
      .mode-switcher button { color: var(--muted); border-radius: 9px; background: transparent; font-size: 12px; }
      .mode-switcher button.active { color: #ffffff; background: #17324d; }

      .paper-panel {
        position: fixed;
        z-index: 18;
        top: 94px;
        right: 18px;
        width: min(330px, calc(100vw - 36px));
        max-height: calc(100vh - 150px);
        overflow: auto;
        padding: 20px;
        border-radius: 16px;
      }
      .paper-panel h2 { margin: 8px 32px 14px 0; font-size: 21px; line-height: 1.25; }
      .paper-panel p { color: #425d75; font-size: 13px; line-height: 1.62; }
      .paper-facts { display: flex; flex-wrap: wrap; gap: 6px; }
      .paper-facts span, .paper-links span {
        color: #425d75;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 10px;
      }
      .paper-links { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
      .paper-links a { color: #ffffff; border-radius: 999px; padding: 6px 10px; background: #17324d; font-size: 11px; font-weight: 800; text-decoration: none; }
      .panel-close, .notice button { color: var(--muted); border: 0; background: transparent; cursor: pointer; }
      .panel-close { position: absolute; top: 12px; right: 12px; font-size: 22px; }
      .loading { color: var(--cyan) !important; }

      .notice {
        position: fixed;
        z-index: 25;
        top: 86px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 14px;
        transform: translateX(-50%);
        max-width: min(640px, calc(100vw - 36px));
        padding: 10px 14px;
        color: #17324d;
        border: 1px solid rgba(102, 80, 164, 0.25);
        border-radius: 10px;
        background: rgba(248, 246, 255, 0.96);
        box-shadow: 0 0.5rem 2rem rgba(23, 50, 77, 0.14);
        font-size: 12px;
      }

      .interaction-hint {
        position: fixed;
        z-index: 12;
        left: 18px;
        bottom: 18px;
        color: rgba(23, 50, 77, 0.58);
        font-size: 9px;
        letter-spacing: 0.1em;
        pointer-events: none;
      }

      #gesture-pointer {
        --gesture-scale: 1;
        position: fixed;
        z-index: 30;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(8, 127, 149, 0.86);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 0 5px rgba(8, 127, 149, 0.12), 0 2px 10px rgba(23, 50, 77, 0.24);
        transform: translate(-50%, -50%) scale(var(--gesture-scale));
        transition: transform 90ms ease, border-color 90ms ease, background 90ms ease;
        pointer-events: none;
      }
      #gesture-pointer::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: #087f95;
      }
      #gesture-pointer.hovering {
        --gesture-scale: 1.2;
        border-color: #6650a4;
        background: rgba(102, 80, 164, 0.2);
        box-shadow: 0 0 0 7px rgba(102, 80, 164, 0.14), 0 2px 12px rgba(23, 50, 77, 0.3);
      }
      #gesture-pointer.pinching { --gesture-scale: 0.72; }

      a-scene { position: fixed !important; inset: 0; }

      @media (max-width: 900px) {
        .topbar { grid-template-columns: 1fr auto; }
        .ingest-form { order: 3; grid-column: 1 / -1; width: min(680px, 100%); }
        .graph-overview { top: 140px; }
        .paper-panel { top: 140px; max-height: calc(100vh - 210px); }
      }

      @media (max-width: 620px) {
        .brand-lockup p, .interaction-hint { display: none; }
        .topbar { gap: 8px; padding: 9px; }
        .input-controls label { display: none; }
        .input-controls select { min-width: 0; max-width: 148px; padding: 8px; font-size: 11px; }
        .secondary-button { padding: 9px; font-size: 11px; }
        .ingest-form { grid-template-columns: minmax(0, 1fr) 92px; row-gap: 8px; }
        .ingest-form button { grid-column: 1 / -1; margin-left: 0; }
        .graph-overview { top: 176px; left: 10px; width: 165px; padding: 11px; }
        .paper-panel { top: auto; right: 10px; bottom: 78px; width: calc(100vw - 20px); max-height: 42vh; }
        .mode-switcher { bottom: 12px; }
      }
    </style>
    <script crossorigin="anonymous" src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="/public/constellation.js"></script>
    <link data-trunk rel="copy-dir" href="public">
    <link data-trunk rel="rust" data-bin="meshgraph_gateway" data-wasm-opt="z">
  </head>
  <body></body>
</html>
