<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8edf2">
    <meta
      name="description"
      content="MeshGraph is an interactive WebXR research citation constellation."
    >
    <title>MeshGraph · Research Citation Constellation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #17324d;
        --muted: #617386;
        --cyan: #087f95;
        --violet: #6650a4;
        --panel: rgba(255, 255, 255, 0.86);
        --line: rgba(23, 50, 77, 0.15);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #app-shell {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #e8edf2;
      }

      body { color: var(--ink); }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }

      .brand-lockup {
        position: fixed;
        z-index: 12;
        left: 18px;
        bottom: 18px;
        opacity: 0.7;
        pointer-events: none;
      }
      .brand-lockup h1 { margin: 0; font-size: 19px; letter-spacing: 0.02em; }
      .brand-lockup p { margin: 3px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; }

      .search-controls {
        --search-trigger-size: 48px;
        --search-width: min(378px, calc(100vw - 36px));
        position: fixed;
        z-index: 22;
        top: 18px;
        right: 18px;
        width: var(--search-trigger-size);
        height: var(--search-trigger-size);
      }
      .search-form {
        position: absolute;
        top: 0;
        right: 0;
        width: var(--search-width);
        height: var(--search-trigger-size);
        clip-path: inset(0 0 0 calc(100% - var(--search-trigger-size)) round 12px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        will-change: clip-path, opacity;
        transition:
          clip-path 220ms cubic-bezier(0.4, 0, 0.2, 1),
          opacity 100ms ease 100ms,
          visibility 0s linear 220ms;
      }
      .search-controls.open .search-form {
        clip-path: inset(0 0 0 0 round 12px);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition:
          clip-path 260ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 120ms ease,
          visibility 0s linear 0s;
      }
      .search-form input {
        width: 100%;
        height: 100%;
        padding: 11px 60px 11px 13px;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: 0;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
      }
      .search-form input:focus { box-shadow: inset 0 0 0 1px var(--cyan); }
      .search-controls > .input-control { position: relative; z-index: 1; }
      .input-controls {
        position: fixed;
        z-index: 20;
        right: 18px;
        bottom: 18px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .input-controls .input-control { color: var(--muted); }
      .input-controls .input-control svg,
      .input-controls .input-control .ir-mark { opacity: 0.68; }
      .input-controls .input-control:hover svg,
      .input-controls .input-control:hover .ir-mark { opacity: 0.84; }
      .input-controls .input-control.active svg,
      .input-controls .input-control.active .ir-mark { opacity: 0.68; }
      .input-control {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        padding: 0;
        color: var(--ink);
        border: 0;
        border-radius: 12px;
        outline: 0;
        background: transparent;
        cursor: pointer;
        transition: opacity 140ms ease;
      }
      .input-control svg {
        width: 25px;
        height: 25px;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.52;
        transition: opacity 140ms ease;
      }
      .input-control svg * { vector-effect: non-scaling-stroke; }
      #reset-view-button svg { width: 26px; height: 26px; }
      #webcam-input-button svg { width: 31px; height: 31px; }
      #enter-vr-button svg { width: 25px; height: 25px; }
      #settings-button svg { width: 23px; height: 23px; }
      .input-control:hover svg, .input-control:hover .ir-mark { opacity: 0.78; }
      .input-control.active svg, .input-control.active .ir-mark { opacity: 0.68; }
      .ir-mark {
        font-size: 19px;
        font-weight: 750;
        line-height: 1;
        letter-spacing: 0.04em;
        opacity: 0.52;
        transition: opacity 140ms ease;
      }
      .input-control:disabled {
        opacity: 1;
        cursor: not-allowed;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .hud-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 0.5rem 2rem rgba(23, 50, 77, 0.12);
        backdrop-filter: blur(18px);
      }
      .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; }

      .settings-menu {
        position: fixed;
        z-index: 20;
        right: 18px;
        bottom: 78px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: min(280px, calc(100vw - 36px));
        max-height: calc(100vh - 174px);
        overflow-y: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 0.75rem 2.5rem rgba(23, 50, 77, 0.14);
        backdrop-filter: blur(18px);
        transform-origin: right bottom;
        animation: settings-menu-in 140ms ease-out;
      }
      @keyframes settings-menu-in {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .settings-label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .connection-options, .depth-options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
      }
      .connection-options button, .depth-options button {
        width: 100%;
        padding: 9px 5px;
        color: var(--muted);
        border: 0;
        border-radius: 9px;
        background: transparent;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
      }
      .connection-options button:hover, .depth-options button:hover { background: rgba(23, 50, 77, 0.05); }
      .connection-options button.active, .depth-options button.active {
        color: var(--ink);
        background: rgba(23, 50, 77, 0.09);
      }
      .settings-menu section + section {
        padding-top: 15px;
        border-top: 1px solid var(--line);
      }
      .navigation-guide > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 26px;
        color: var(--muted);
        font-size: 11px;
      }
      .navigation-guide kbd {
        color: var(--ink);
        background: transparent;
        font-family: inherit;
        font-size: 10px;
        font-weight: 700;
        line-height: 1.3;
      }
      .input-status > span:last-child {
        display: block;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .paper-panel {
        position: fixed;
        z-index: 18;
        top: 18px;
        left: 18px;
        display: flex;
        height: min(680px, calc(100vh - 100px));
        width: min(360px, calc(100vw - 36px));
        overflow: hidden;
        padding: 20px;
        border-radius: 16px;
      }
      .paper-content { display: flex; flex: 1; flex-direction: column; width: 100%; min-width: 0; min-height: 0; }
      .paper-panel h2 { max-width: 100%; margin: 8px 32px 14px 0; overflow-wrap: anywhere; font-size: 21px; line-height: 1.25; }
      .paper-panel p { color: #425d75; font-size: 13px; line-height: 1.62; }
      .paper-abstract {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        overflow-wrap: anywhere;
        word-break: break-word;
        margin: 18px 0 0;
        padding-bottom: 22px;
        -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
        mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
      }
      .paper-facts { display: flex; flex-wrap: wrap; gap: 6px; }
      .paper-facts span, .paper-links span {
        color: #425d75;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 10px;
      }
      .paper-links {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .paper-links:empty { display: none; }
      .paper-links a { color: #ffffff; border-radius: 999px; padding: 6px 10px; background: #17324d; font-size: 11px; font-weight: 800; text-decoration: none; }
      .panel-close, .notice button { color: var(--muted); border: 0; background: transparent; cursor: pointer; }
      .panel-close { position: absolute; top: 12px; right: 12px; font-size: 22px; }
      .loading { color: var(--cyan) !important; }

      .notice {
        position: fixed;
        z-index: 25;
        top: 86px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 14px;
        transform: translateX(-50%);
        max-width: min(640px, calc(100vw - 36px));
        padding: 10px 14px;
        color: #17324d;
        border: 1px solid rgba(102, 80, 164, 0.25);
        border-radius: 10px;
        background: rgba(248, 246, 255, 0.96);
        box-shadow: 0 0.5rem 2rem rgba(23, 50, 77, 0.14);
        font-size: 12px;
      }

      #gesture-pointer {
        --gesture-scale: 1;
        position: fixed;
        z-index: 30;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(102, 80, 164, 0.62);
        border-radius: 50%;
        background: rgba(102, 80, 164, 0.12);
        box-shadow: 0 0 0 5px rgba(102, 80, 164, 0.08), 0 2px 10px rgba(23, 50, 77, 0.2);
        transform: translate(-50%, -50%) scale(var(--gesture-scale));
        transition: transform 90ms ease, border-color 90ms ease, background 90ms ease;
        pointer-events: none;
      }
      #gesture-pointer::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: rgba(102, 80, 164, 0.72);
      }
      #gesture-pointer.hovering {
        --gesture-scale: 1.2;
        border-color: #6650a4;
        background: rgba(102, 80, 164, 0.2);
        box-shadow: 0 0 0 7px rgba(102, 80, 164, 0.14), 0 2px 12px rgba(23, 50, 77, 0.3);
      }
      #gesture-pointer.pinching { --gesture-scale: 0.72; }

      a-scene { position: fixed !important; inset: 0; }

      @media (max-width: 620px) {
        .brand-lockup p { display: none; }
        .brand-lockup { left: 10px; bottom: 12px; }
        .search-controls {
          --search-trigger-size: 43px;
          --search-width: calc(100vw - 20px);
          top: 10px;
          right: 10px;
        }
        .search-form input { padding-right: 55px; }
        .input-controls { right: 10px; bottom: 12px; gap: 6px; }
        .input-control { width: 43px; height: 43px; }
        .settings-menu { right: 10px; bottom: 65px; width: min(280px, calc(100vw - 20px)); }
        .paper-panel { top: 65px; left: 10px; height: calc(100vh - 132px); width: calc(100vw - 20px); }
      }
    </style>
    <script crossorigin="anonymous" src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="/public/constellation.js?v=0.11.6"></script>
    <link data-trunk rel="copy-dir" href="public">
    <link data-trunk rel="rust" data-bin="meshgraph_gateway" data-wasm-opt="z">
  </head>
  <body></body>
</html>
