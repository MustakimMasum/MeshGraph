<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="MeshGraph is an interactive WebXR research citation constellation."
    >
    <title>MeshGraph · Research Citation Constellation</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #e7f6ff;
        --muted: #86a0b9;
        --cyan: #59e1ff;
        --violet: #9b7bff;
        --panel: rgba(5, 16, 31, 0.82);
        --line: rgba(114, 210, 255, 0.2);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #app-shell {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
      }

      body { color: var(--ink); }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }

      .topbar {
        position: fixed;
        z-index: 20;
        inset: 0 0 auto 0;
        min-height: 74px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(420px, 620px) auto;
        align-items: center;
        gap: 18px;
        padding: 12px 18px;
        background: linear-gradient(180deg, rgba(2, 7, 17, 0.96), rgba(2, 7, 17, 0.58));
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px);
      }

      .brand-lockup { display: flex; align-items: center; gap: 11px; }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(89, 225, 255, 0.5);
        border-radius: 12px;
        color: var(--cyan);
        font-weight: 800;
        background: radial-gradient(circle at 35% 30%, #183957, #07111f 65%);
        box-shadow: 0 0 28px rgba(89, 225, 255, 0.15);
      }
      .brand-lockup h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
      .brand-lockup p { margin: 2px 0 0; color: var(--muted); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; }

      .ingest-form {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 94px auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(1, 8, 20, 0.88);
      }
      .ingest-form input, .ingest-form select {
        min-width: 0;
        color: var(--ink);
        border: 0;
        border-right: 1px solid var(--line);
        outline: 0;
        background: transparent;
        padding: 11px 12px;
      }
      .ingest-form input:focus { box-shadow: inset 0 0 0 1px var(--cyan); }
      .ingest-form button, .secondary-button, .mode-switcher button {
        border: 0;
        color: #03101a;
        background: var(--cyan);
        padding: 10px 14px;
        font-weight: 750;
        cursor: pointer;
      }
      .ingest-form button:disabled { opacity: 0.55; cursor: wait; }
      .secondary-button {
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(7, 20, 38, 0.88);
      }

      .hud-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
      }
      .graph-overview {
        position: fixed;
        z-index: 15;
        top: 94px;
        left: 18px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 210px;
        padding: 15px;
        border-radius: 14px;
      }
      .graph-overview strong { font-size: 24px; color: var(--cyan); }
      .graph-overview > span:not(.eyebrow) { color: var(--muted); font-size: 12px; }
      .graph-overview .gesture-state { margin-top: 4px; padding-top: 9px; border-top: 1px solid var(--line); }
      .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: 0.14em; }

      .mode-switcher {
        position: fixed;
        z-index: 15;
        left: 50%;
        bottom: 26px;
        display: flex;
        transform: translateX(-50%);
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(3, 12, 25, 0.86);
        backdrop-filter: blur(16px);
      }
      .mode-switcher button { color: var(--muted); border-radius: 9px; background: transparent; font-size: 12px; }
      .mode-switcher button.active { color: #021018; background: var(--cyan); }

      .paper-panel {
        position: fixed;
        z-index: 18;
        top: 94px;
        right: 18px;
        width: min(390px, calc(100vw - 36px));
        max-height: calc(100vh - 150px);
        overflow: auto;
        padding: 22px;
        border-radius: 16px;
      }
      .paper-panel h2 { margin: 8px 32px 14px 0; font-size: 21px; line-height: 1.25; }
      .paper-panel p { color: #adc0d1; font-size: 13px; line-height: 1.62; }
      .paper-facts { display: flex; flex-wrap: wrap; gap: 6px; }
      .paper-facts span, .paper-links span {
        color: #b5cde0;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 10px;
      }
      .paper-links { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
      .paper-links a { color: #00111a; border-radius: 999px; padding: 6px 10px; background: var(--cyan); font-size: 11px; font-weight: 800; text-decoration: none; }
      .panel-close, .notice button { color: var(--muted); border: 0; background: transparent; cursor: pointer; }
      .panel-close { position: absolute; top: 12px; right: 12px; font-size: 22px; }
      .loading { color: var(--cyan) !important; }

      .notice {
        position: fixed;
        z-index: 25;
        top: 86px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 14px;
        transform: translateX(-50%);
        max-width: min(640px, calc(100vw - 36px));
        padding: 10px 14px;
        color: #d9eeff;
        border: 1px solid rgba(155, 123, 255, 0.38);
        border-radius: 10px;
        background: rgba(25, 17, 55, 0.92);
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.35);
        font-size: 12px;
      }

      .interaction-hint {
        position: fixed;
        z-index: 12;
        left: 18px;
        bottom: 18px;
        color: rgba(173, 203, 225, 0.56);
        font-size: 9px;
        letter-spacing: 0.1em;
        pointer-events: none;
      }

      a-scene { position: fixed !important; inset: 0; }

      @media (max-width: 900px) {
        .topbar { grid-template-columns: 1fr auto; }
        .ingest-form { order: 3; grid-column: 1 / -1; }
        .graph-overview { top: 140px; }
        .paper-panel { top: 140px; max-height: calc(100vh - 210px); }
      }

      @media (max-width: 620px) {
        .brand-lockup p, .interaction-hint { display: none; }
        .topbar { gap: 8px; padding: 9px; }
        .secondary-button { padding: 9px; font-size: 11px; }
        .ingest-form { grid-template-columns: 1fr 80px; }
        .ingest-form button { grid-column: 1 / -1; }
        .graph-overview { top: 176px; left: 10px; width: 165px; padding: 11px; }
        .paper-panel { top: auto; right: 10px; bottom: 78px; width: calc(100vw - 20px); max-height: 42vh; }
        .mode-switcher { bottom: 12px; }
      }
    </style>
    <script crossorigin="anonymous" src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="/public/constellation.js"></script>
    <link data-trunk rel="copy-dir" href="public">
    <link data-trunk rel="rust" data-wasm-opt="z">
  </head>
  <body></body>
</html>
