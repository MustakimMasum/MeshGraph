<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Cadmus Spatial Knowledge Base</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #e8edf2;
      }
    </style>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("vertical-controls", {
        schema: { speed: { default: 3 } },

        init: function () {
          this.direction = 0;
          this.onKeyDown = (event) => {
            if (event.code === "KeyE") this.direction = 1;
            if (event.code === "KeyC") this.direction = -1;
          };
          this.onKeyUp = (event) => {
            if (
              (event.code === "KeyE" && this.direction === 1) ||
              (event.code === "KeyC" && this.direction === -1)
            ) {
              this.direction = 0;
            }
          };
          window.addEventListener("keydown", this.onKeyDown);
          window.addEventListener("keyup", this.onKeyUp);
        },

        tick: function (_time, delta) {
          if (!this.direction) return;
          this.el.object3D.position.y +=
            this.direction * this.data.speed * (delta / 1000);
        },

        remove: function () {
          window.removeEventListener("keydown", this.onKeyDown);
          window.removeEventListener("keyup", this.onKeyUp);
        },
      });

      AFRAME.registerComponent("initial-camera-look", {
        schema: {
          pitch: { default: 0 },
          yaw: { default: 0 },
        },

        tick: function () {
          if (this.applied) return;
          const controls = this.el.components["look-controls"];
          if (!controls?.pitchObject || !controls?.yawObject) return;

          controls.pitchObject.rotation.x = THREE.MathUtils.degToRad(
            this.data.pitch,
          );
          controls.yawObject.rotation.y = THREE.MathUtils.degToRad(
            this.data.yaw,
          );
          this.applied = true;
        },
      });

      AFRAME.registerComponent("semantic-highlight", {
        schema: { state: { default: "none" } },

        init: function () {
          this.el.addEventListener("model-loaded", () => this.apply());
        },

        update: function () {
          this.apply();
        },

        apply: function () {
          this.el.object3D.traverse((node) => {
            if (!node.isMesh || !node.material?.emissive) return;
            if (!node.userData.semanticMaterialCloned) {
              node.material = node.material.clone();
              node.userData.semanticMaterialCloned = true;
              node.userData.semanticOriginalEmissive =
                node.material.emissive.clone();
              node.userData.semanticOriginalIntensity =
                node.material.emissiveIntensity ?? 1;
            }

            let targetColor = node.userData.semanticOriginalEmissive;
            let targetIntensity = node.userData.semanticOriginalIntensity;

            if (this.data.state === "active") {
              targetColor = new THREE.Color("#00ff66");
              targetIntensity = 0.75;
            } else if (this.data.state === "related") {
              targetColor = new THREE.Color("#ff9900");
              targetIntensity = 0.75;
            }

            node.material.emissive.copy(targetColor);
            node.material.emissiveIntensity = targetIntensity;
          });
        },
      });

      AFRAME.registerComponent("always-on-top", {
        tick: function () {
          this.el.object3D.traverse((node) => {
            if (node.isMesh && node.material && node.material.depthTest !== false) {
              node.material.depthTest = false;
              node.material.depthWrite = false;
            }
          });
        },
      });

      AFRAME.registerComponent("connection-tether", {
        schema: {
          source: { type: "selector" },
          target: { type: "selector" },
          color: { default: "#ff9900" },
        },

        init: function () {
          this.start = new THREE.Vector3();
          this.end = new THREE.Vector3();
        },

        tick: function () {
          if (!this.data.source || !this.data.target) return;
          this.data.source.object3D.getWorldPosition(this.start);
          this.data.target.object3D.getWorldPosition(this.end);
          this.el.setAttribute(
            "line",
            `start: ${this.start.x} ${this.start.y} ${this.start.z}; ` +
              `end: ${this.end.x} ${this.end.y} ${this.end.z}; ` +
              `color: ${this.data.color}; opacity: 0.75`,
          );
        },
      });

      AFRAME.registerComponent("vr-assemble-control", {
        schema: { active: { default: false } },

        init: function () {
          this.onEnterVr = () => this.updateVisibility();
          this.onExitVr = () => this.updateVisibility();
          this.el.sceneEl.addEventListener("enter-vr", this.onEnterVr);
          this.el.sceneEl.addEventListener("exit-vr", this.onExitVr);
          this.updateVisibility();
        },

        update: function () {
          this.updateVisibility();
        },

        updateVisibility: function () {
          this.el.setAttribute(
            "visible",
            this.data.active && this.el.sceneEl.is("vr-mode"),
          );
        },

        remove: function () {
          this.el.sceneEl.removeEventListener("enter-vr", this.onEnterVr);
          this.el.sceneEl.removeEventListener("exit-vr", this.onExitVr);
        },
      });

      AFRAME.registerComponent("viewport-controls", {
        schema: {
          zoomSpeed: { default: 0.0025 },
          panSpeed: { default: 0.004 },
        },

        init: function () {
          this.dragging = false;
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.up = new THREE.Vector3();

          this.onWheel = (event) => {
            event.preventDefault();
            this.el.object3D.getWorldDirection(this.forward);
            this.el.object3D.position.addScaledVector(
              this.forward,
              event.deltaY * this.data.zoomSpeed,
            );
          };
          this.onMouseDown = (event) => {
            if (event.button !== 1) return;
            event.preventDefault();
            this.dragging = true;
          };
          this.onMouseMove = (event) => {
            if (!this.dragging) return;
            this.right.set(1, 0, 0).applyQuaternion(this.el.object3D.quaternion);
            this.up.set(0, 1, 0).applyQuaternion(this.el.object3D.quaternion);
            this.el.object3D.position.addScaledVector(
              this.right,
              -event.movementX * this.data.panSpeed,
            );
            this.el.object3D.position.addScaledVector(
              this.up,
              event.movementY * this.data.panSpeed,
            );
          };
          this.onMouseUp = (event) => {
            if (event.button === 1) this.dragging = false;
          };
          this.onAuxClick = (event) => {
            if (event.button === 1) event.preventDefault();
          };

          this.el.sceneEl.canvas.addEventListener("wheel", this.onWheel, {
            passive: false,
          });
          this.el.sceneEl.canvas.addEventListener("mousedown", this.onMouseDown);
          window.addEventListener("mousemove", this.onMouseMove);
          window.addEventListener("mouseup", this.onMouseUp);
          this.el.sceneEl.canvas.addEventListener("auxclick", this.onAuxClick);
        },

        remove: function () {
          this.el.sceneEl.canvas.removeEventListener("wheel", this.onWheel);
          this.el.sceneEl.canvas.removeEventListener(
            "mousedown",
            this.onMouseDown,
          );
          window.removeEventListener("mousemove", this.onMouseMove);
          window.removeEventListener("mouseup", this.onMouseUp);
          this.el.sceneEl.canvas.removeEventListener(
            "auxclick",
            this.onAuxClick,
          );
        },
      });

      AFRAME.registerComponent("webxr-launcher", {
        schema: {
          sessionTimeout: { default: 15000 },
        },

        init: function () {
          this.button = document.getElementById("enter-vr-button");
          this.status = document.getElementById("vr-status");
          if (!this.button || !this.status) return;

          this.setState = (label, status, disabled) => {
            this.button.setAttribute("aria-label", label);
            this.button.setAttribute("title", label);
            this.button.disabled = disabled;
            this.status.textContent = status;
          };
          this.onClick = async () => {
            try {
              this.setState("Starting VR...", "Requesting headset access", true);
              await Promise.race([
                this.el.enterVR(),
                new Promise((_, reject) =>
                  setTimeout(
                    () => reject(new Error("WebXR session request timed out")),
                    this.data.sessionTimeout,
                  ),
                ),
              ]);
            } catch (error) {
              console.error("Unable to enter VR", error);
              this.setState(
                "Enter VR",
                "Unable to start VR; check headset permissions",
                false,
              );
            }
          };
          this.onEnterVr = () =>
            this.setState("VR Active", "Use headset controls to exit", true);
          this.onExitVr = () =>
            this.setState("Enter VR", "Headset ready", false);

          this.button.addEventListener("click", this.onClick);
          this.el.addEventListener("enter-vr", this.onEnterVr);
          this.el.addEventListener("exit-vr", this.onExitVr);

          if (!window.isSecureContext) {
            this.setState("Enter VR", "HTTPS or localhost required", true);
            return;
          }
          if (!navigator.xr?.isSessionSupported) {
            this.setState("Enter VR", "WebXR not supported (use Chrome or Edge)", true);
            return;
          }

          navigator.xr
            .isSessionSupported("immersive-vr")
            .then((supported) => {
              this.setState(
                "Enter VR",
                supported ? "Headset ready" : "No headset detected — ensure SteamVR or Oculus software is running",
                !supported,
              );
            })
            .catch((err) => {
              console.error("WebXR session support check failed", err);
              this.setState("Enter VR", "WebXR check failed — ensure headset runtime is active", true);
            });
        },

        remove: function () {
          this.button?.removeEventListener("click", this.onClick);
          this.el.removeEventListener("enter-vr", this.onEnterVr);
          this.el.removeEventListener("exit-vr", this.onExitVr);
        },
      });

      AFRAME.registerComponent("vr-locomotion", {
        schema: {
          speed: { default: 3 },
          turnAngle: { default: 45 },
          deadzone: { default: 0.2 },
        },

        init: function () {
          this.moveX = 0;
          this.moveY = 0;
          this.snapping = false;
          this.cameraEl = null;
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.worldQuat = new THREE.Quaternion();
          this.yawEuler = new THREE.Euler();
          this.moveEuler = new THREE.Euler();

          this.onLeftThumbstick = (e) => {
            this.moveX = Math.abs(e.detail.x) > this.data.deadzone ? e.detail.x : 0;
            this.moveY = Math.abs(e.detail.y) > this.data.deadzone ? e.detail.y : 0;
          };

          this.onRightThumbstick = (e) => {
            const x = e.detail.x;
            if (!this.snapping && Math.abs(x) > 0.7) {
              this.el.object3D.rotation.y += THREE.MathUtils.degToRad(
                (x > 0 ? -1 : 1) * this.data.turnAngle,
              );
              this.snapping = true;
            } else if (Math.abs(x) <= 0.3) {
              this.snapping = false;
            }
          };

          this.bindControllers = () => {
            const left = document.getElementById("left-controller");
            const right = document.getElementById("right-controller");
            if (left) left.addEventListener("thumbstickmoved", this.onLeftThumbstick);
            if (right) right.addEventListener("thumbstickmoved", this.onRightThumbstick);
          };

          this.unbindControllers = () => {
            const left = document.getElementById("left-controller");
            const right = document.getElementById("right-controller");
            if (left) left.removeEventListener("thumbstickmoved", this.onLeftThumbstick);
            if (right) right.removeEventListener("thumbstickmoved", this.onRightThumbstick);
          };

          this.el.sceneEl.addEventListener("enter-vr", this.bindControllers);
          this.el.sceneEl.addEventListener("exit-vr", this.unbindControllers);
          if (this.el.sceneEl.is("vr-mode")) this.bindControllers();
        },

        tick: function (_time, delta) {
          if (!this.el.sceneEl.is("vr-mode")) return;
          if (!this.moveX && !this.moveY) return;

          if (!this.cameraEl) {
            this.cameraEl = this.el.querySelector("[camera]");
            if (!this.cameraEl) return;
          }

          this.cameraEl.object3D.getWorldQuaternion(this.worldQuat);
          this.moveEuler.setFromQuaternion(this.worldQuat, "YXZ");
          this.yawEuler.set(0, this.moveEuler.y, 0);

          this.forward.set(0, 0, -1).applyEuler(this.yawEuler);
          this.right.set(1, 0, 0).applyEuler(this.yawEuler);

          const dt = delta / 1000;
          this.el.object3D.position.addScaledVector(
            this.forward,
            -this.moveY * this.data.speed * dt,
          );
          this.el.object3D.position.addScaledVector(
            this.right,
            this.moveX * this.data.speed * dt,
          );
        },

        remove: function () {
          this.unbindControllers();
          this.el.sceneEl.removeEventListener("enter-vr", this.bindControllers);
          this.el.sceneEl.removeEventListener("exit-vr", this.unbindControllers);
        },
      });
    </script>
    <link data-trunk rel="copy-dir" href="public">
    <link data-trunk rel="rust" data-wasm-opt="z">
  </head>
  <body></body>
</html>
